<script>
/* post-load safety net: heal missing labels and shrink overflowing ones; can never block rendering */
addEventListener("load", function(){
  try{
    var btn = document.getElementById("fetchBtn");
    if(btn && !btn.textContent.trim() && typeof applyLang === "function") applyLang();
    if(typeof renderSnap === "function") renderSnap();
  }catch(e){}
  var queued = 0;
  function fitEl(el){
    el.style.minWidth = "0";
    el.style.maxWidth = "100%";
    el.style.overflow = "hidden";
    el.style.textOverflow = "ellipsis";
    el.style.whiteSpace = "nowrap";
    el.style.fontSize = "";
    el.title = el.textContent || "";
    var size = parseFloat(getComputedStyle(el).fontSize) || 16, guard = 0;
    while(el.scrollWidth > el.clientWidth + 1 && size > 10 && guard++ < 16){
      size -= 1; el.style.fontSize = size + "px";
    }
  }
  function scan(sel){
    var root = document.querySelector(sel);
    if(!root) return;
    var nodes = root.querySelectorAll("*");
    for(var i = 0; i < nodes.length; i++){
      var el = nodes[i];
      if(!el.clientWidth || el.childElementCount > 0) continue;
      if(el.scrollWidth > el.clientWidth + 1) fitEl(el);
    }
  }
  function run(){ queued = 0; try{ scan(".lbctl"); scan(".trendctl"); }catch(e){} }
  function soon(){ if(!queued) queued = requestAnimationFrame(run); }
  addEventListener("resize", soon);
  document.addEventListener("change", function(e){
    if(e.target && e.target.closest && e.target.closest(".lbctl,.trendctl")) soon();
  });
  run(); setTimeout(soon, 400); setTimeout(soon, 1500);
});
</script>
