<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140a20">
<title>Hive</title>
<style>
:root{
  --bg-a:#2a1442; --bg-b:#140a20;
  --gold:#ffc02e; --violet:#a05fd6; --pink:#ff7ab8; --green:#4fd48a;
  --text:#f4eefb; --soft:#a493be;
  --panel:rgba(24,13,38,.72); --tile:rgba(255,255,255,.075); --edge:rgba(255,255,255,.13);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;padding:0 0 92px;min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(120% 70% at 50% 0%, rgba(139,68,199,.35) 0%, transparent 60%),
    linear-gradient(170deg, var(--bg-a) 0%, var(--bg-b) 65%) fixed;
}
#aura{position:fixed;inset:-25%;z-index:-2;pointer-events:none;opacity:.9;
  will-change:transform;contain:strict;
  background:
    radial-gradient(38% 32% at 22% 18%, rgba(168,92,224,.50), transparent 70%),
    radial-gradient(30% 26% at 82% 26%, rgba(255,192,46,.14), transparent 70%),
    radial-gradient(42% 38% at 62% 78%, rgba(108,52,178,.42), transparent 72%),
    radial-gradient(34% 30% at 12% 84%, rgba(255,122,184,.12), transparent 72%)}
@media (prefers-reduced-motion: no-preference){
  #aura{animation:drift 30s ease-in-out infinite alternate}
}
@keyframes drift{
  0%{transform:translate3d(-3%,-2%,0) scale(1)}
  50%{transform:translate3d(3%,2%,0) scale(1.1)}
  100%{transform:translate3d(-1%,3%,0) scale(1.04)}
}
#comb{position:fixed;top:-84px;left:-72px;width:calc(100% + 144px);
  height:calc(100% + 168px);z-index:-1;pointer-events:none;will-change:transform;contain:strict}
#spot{position:fixed;top:-40vh;left:-40vw;width:80vw;height:80vw;z-index:-1;pointer-events:none;
  border-radius:50%;will-change:transform;contain:strict;
  background:radial-gradient(circle, rgba(255,192,46,.16) 0%, rgba(255,192,46,.07) 38%, transparent 68%)}
@media (prefers-reduced-motion: no-preference){
  #comb{animation:combDrift 48s linear infinite}
  #spot{animation:spotMove 26s ease-in-out infinite alternate}
}
@keyframes combDrift{
  from{transform:translate3d(0,0,0)}
  to{transform:translate3d(72px,83.14px,0)}
}
@keyframes spotMove{
  0%{transform:translate3d(20vw,25vh,0)}
  50%{transform:translate3d(90vw,70vh,0)}
  100%{transform:translate3d(45vw,120vh,0)}
}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 0}
h2{font-size:15px;margin:26px 0 0;font-weight:700;color:var(--gold)}
h3{font-size:16px;margin:0 0 12px;font-weight:700;color:var(--gold)}
.sub{color:var(--soft);font-size:14px;margin:6px 0 0;line-height:1.55}
button,input,select{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
code{font-size:12px;background:rgba(0,0,0,.3);padding:1px 5px;border-radius:4px}

.idline{display:flex;align-items:center;gap:9px;padding:0;margin:0;font-size:24px;font-weight:800;
  line-height:1.2}
.idline .lvl{color:var(--gold);font-size:16px;font-weight:800}
.idline .tag,.stick .tag{font-size:inherit;font-weight:800;line-height:1;white-space:nowrap}
.rl{background:linear-gradient(100deg,var(--rankc1,var(--rankc)) 0 26%,var(--rankc2) 50%,
  var(--rankc1,var(--rankc)) 74% 100%);
  background-size:230% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  padding:0 1px}
@media (prefers-reduced-motion: no-preference){
  .rl{animation:shine2 2.6s ease-in-out infinite alternate}
}
@keyframes shine2{from{background-position:0% 0}to{background-position:100% 0}}
.nk{background:linear-gradient(100deg,var(--text) 0 38%,var(--rankc,var(--gold)) 50%,var(--text) 62% 100%);
  background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
@media (prefers-reduced-motion: no-preference){
  .nk{animation:shine 5s linear infinite}
}
@keyframes shine{from{background-position:130% 0}to{background-position:-50% 0}}
.stick{position:fixed;top:0;left:0;right:0;z-index:8;display:block;
  padding:14px 16px;font-size:24px;font-weight:800;line-height:1.2;
  background:rgba(19,10,30,.97);
  border-bottom:1px solid var(--edge);
  transform:translateY(-102%);opacity:0;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
.stick.on{transform:none;opacity:1}

.srow{display:flex;align-items:center;justify-content:space-between;gap:14px}
.srow > div{text-align:center;flex:1}
.srow .sep{flex:0 0 1px;align-self:stretch;background:var(--edge);max-width:1px}
.sfoot{display:flex;flex-direction:column;align-items:center;gap:7px;margin-top:16px;
  padding-top:14px;border-top:1px solid rgba(255,255,255,.07)}
.sfoot .pill{margin-top:0}
.sfoot .reset{color:var(--soft);font-size:12px}
.srow b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.srow small{display:block;color:var(--soft);font-size:13px;margin-top:4px}
.pill{display:inline-block;margin-top:14px;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:700}
.pill.ok{background:rgba(79,212,138,.16);color:var(--green)}
.pill.no{background:rgba(255,192,46,.16);color:var(--gold)}
.pill.unk{background:var(--tile);color:var(--soft)}
.ciw{width:34px;height:34px;border-radius:9px;flex:none;padding:3px;
  background:linear-gradient(160deg,#ffd970,#d99a15);box-shadow:0 3px 9px rgba(0,0,0,.3)}
.ciw span{display:block;width:100%;height:100%;border-radius:6px;overflow:hidden;background:#170e22}
.ciw img{width:156%;height:156%;margin:-28%;object-fit:contain;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:10px;margin-top:12px}
.it{background:linear-gradient(160deg,#ffd970,#d99a15);border-radius:13px;padding:5px;
  aspect-ratio:1;box-shadow:0 4px 12px rgba(0,0,0,.28)}
.it .box{width:100%;height:100%;border-radius:8px;overflow:hidden;background:#170e22;
  display:grid;place-items:center}
.it .box img{width:154%;height:154%;margin:-27%;object-fit:contain;display:block}
.it .box em{font-style:normal;color:var(--soft);font-size:20px;font-weight:800}
.tlist div{padding:10px 0;font-size:16px;border-top:1px solid rgba(255,255,255,.07);font-size:15px}
.tlist div:first-child{border-top:none}
.more{margin-top:12px}
.hero{text-align:center;padding:10px 0 4px}
.ava{width:104px;height:104px;margin:0 auto;border-radius:14px;
  background:linear-gradient(160deg,#ffd970,#d99a15);padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.ava span{display:grid;place-items:center;overflow:hidden;width:100%;height:100%;border-radius:7px;
  background:linear-gradient(160deg,#fff,#f3dff0);color:#2a1442;font-size:38px;font-weight:800}
.ava img{width:152%;height:152%;margin:-26%;border-radius:0;display:block;object-fit:contain;background:transparent}
.title{color:var(--pink);font-size:19px;margin:12px 0 0;font-weight:600;text-align:center;
  line-height:1.25}


.card{background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:16px;
  margin-top:14px;contain:content}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.tile{background:var(--tile);border-radius:14px;padding:14px;min-width:0;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;text-align:center}
.tile b{display:block;max-width:100%;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;
  font-size:clamp(20px,6.4vw,26px)}
.tile b.sm{font-size:clamp(17px,5.2vw,22px)}
.tile b.xs{font-size:clamp(14px,4.3vw,18px)}
.tile b.xxs{font-size:clamp(11px,3.4vw,15px)}
.tile small{display:block;color:var(--soft);font-size:13px;margin-top:5px;line-height:1.3}
.tile .d{color:var(--gold);font-size:13px;font-weight:700;margin-left:7px}
.tile.w2{grid-column:span 2}
.tile.wide{grid-column:1/-1}
.tile.w2,.tile.wide{flex-direction:row;align-items:center;justify-content:space-between;gap:14px;text-align:left}
.tile.wide.lvl{flex-direction:column;align-items:stretch;text-align:center;gap:0}
.tile.wide.lvl b{text-align:center;flex:none}
.tile.wide.lvl small{max-width:none;text-align:center;margin-top:2px}
.tile.w2 small,.tile.wide small{margin-top:0;text-align:right;min-width:0;
  max-width:46%;white-space:normal;overflow-wrap:break-word;word-break:normal}
.tile.w2 b,.tile.wide b{flex:1 1 auto;min-width:0;white-space:normal;overflow-wrap:break-word;
  word-break:normal;hyphens:none;text-align:left}
.tile.w2 small,.tile.wide small{flex:0 1 auto}

.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.game{position:relative;overflow:hidden;text-align:left;background:var(--panel);
  border:1px solid var(--edge);border-radius:18px;padding:16px;color:var(--text);cursor:pointer}
.game::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  transform:scaleX(0);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.game::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(120% 80% at 50% 0%, rgba(255,192,46,.14), transparent 62%);
  transition:opacity .28s ease}
.game .big,.game b{transition:color .2s ease}
.game b{display:block;font-size:16px;font-weight:700;margin-bottom:10px}
.game .gs{display:grid;gap:8px;margin-top:2px}
.game .gs > div{background:none;padding:0;border-radius:12px}
.game .gs span{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;
  white-space:nowrap}
.game .gs small{display:block;color:var(--soft);font-size:13px;margin-top:2px}
.badge{display:inline-block;background:var(--violet);color:#fff;font-size:11px;font-weight:800;
  padding:3px 8px;border-radius:6px;margin-left:6px;vertical-align:middle}

.bar{height:9px;border-radius:5px;background:rgba(0,0,0,.35);overflow:hidden;margin:9px 0 6px;width:100%}
.bar i{display:block;height:100%;background:var(--violet);border-radius:5px}

.cos{display:flex;justify-content:space-between;gap:12px;padding:11px 0;
  border-top:1px solid rgba(255,255,255,.07);font-size:15px}
.cos span{color:var(--soft);min-width:0;flex:1}
.cos i{display:block;font-style:normal;color:var(--soft);opacity:.75;font-size:12px;
  margin-top:4px;line-height:1.45;overflow-wrap:anywhere}
.cos.sum{border-top:1px solid var(--edge)}
.cos.sum span{color:var(--text);font-weight:600}
.cos.sum b{font-size:18px}
.cos.sum.gold b{color:var(--gold)}
.cos b{font-weight:600;display:flex;align-items:center;gap:8px;justify-content:flex-end;text-align:right}


.primary{width:100%;padding:16px;border:none;border-radius:13px;margin-top:18px;cursor:pointer;
  background:var(--gold);color:#2a1442;font-size:16px;font-weight:700;box-shadow:0 6px 18px rgba(255,192,46,.22)}
.primary:disabled{background:var(--panel);color:var(--soft);box-shadow:none;cursor:default}
.mini{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:10px 14px;
  font-size:14px;color:var(--text);cursor:pointer}
input,select{width:100%;padding:13px;font-size:16px;color:var(--text);border-radius:11px;
  background:rgba(0,0,0,.25);border:1px solid var(--edge)}
label{display:block;font-size:13px;color:var(--soft);margin:20px 0 7px}

#vSet .card.set{padding:16px 16px 18px}
#vSet label{display:block;font-size:12px;font-weight:700;letter-spacing:.03em;
  color:var(--soft);margin:0 0 7px;text-transform:none}
#vSet .row2{margin-top:14px;gap:12px;align-items:stretch}
#vSet .row2 > div{display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
#vSet .row2 label{margin-top:0}
#vSet input[type=text],#vSet select{font-size:15px;font-weight:500;padding:12px 13px;
  border-radius:12px;background:rgba(0,0,0,.32)}
#vSet input[type=text]::placeholder{color:var(--soft);opacity:.55;font-weight:400}
#vSet .hint{margin:10px 0 0;font-size:12.5px;line-height:1.55;color:var(--soft);opacity:.85}
#vSet .check{display:flex;align-items:center;gap:12px;margin:0;padding:11px 0;
  font-size:14.5px;font-weight:500;color:var(--text);letter-spacing:0;cursor:pointer}
#vSet .check + .check{border-top:1px solid rgba(255,255,255,.07)}
#vSet .check input{width:20px;height:20px;flex:none;accent-color:var(--gold);margin:0;cursor:pointer}
#vSet .chips{margin-top:0}
#vSet .chips.btns{gap:9px}
#vSet .chip{font-size:13.5px;font-weight:600;padding:8px 14px}
#vSet .mini{font-size:13.5px;padding:10px 14px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--edge);background:var(--panel);border-radius:22px;padding:9px 15px;
  font-size:14px;color:var(--soft);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#2a1442;font-weight:700}
.chip.dead{opacity:.45;text-decoration:line-through}

.note{border:1px solid var(--edge);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;
  padding:14px 16px;margin:20px 0;font-size:13px;line-height:1.6;color:var(--soft);background:rgba(0,0,0,.2)}
.chart{position:relative;height:150px;margin-top:4px}
svg.line{width:100%;height:100%;display:block}
.line path{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--gold);
  border:2px solid var(--bg-b);transform:translate(-50%,-50%);box-shadow:0 0 10px rgba(255,192,46,.5)}
.tmeta{display:flex;justify-content:space-between;gap:12px;margin-top:8px;
  font-size:12px;color:var(--soft)}

.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;z-index:5;
  background:rgba(19,10,30,.97);border-top:1px solid var(--edge);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tabs button{flex:1;background:none;border:none;font-size:14px;padding:11px;color:var(--soft);
  cursor:pointer;border-radius:10px}
.tabs button[aria-current="page"]{color:var(--gold);font-weight:700;background:rgba(255,192,46,.12)}

.modal{position:fixed;inset:0;z-index:20;background:rgba(10,5,16,.75);overflow:auto}
.modal .inner{min-height:100%;background:var(--bg-b);max-width:640px;margin:0 auto;
  padding:22px 16px calc(30px + env(safe-area-inset-bottom))}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.mhead h3{font-size:26px;color:var(--text);margin:0}
.close{background:var(--violet);border:none;color:#fff;border-radius:10px;padding:11px 18px;
  font-size:15px;font-weight:600;cursor:pointer;flex:none}
.raw{white-space:pre-wrap;word-break:break-all;font-size:12px;line-height:1.5;
  background:rgba(0,0,0,.35);border:1px solid var(--edge);border-radius:12px;padding:14px;margin:0 0 14px}
.hidden{display:none}
.toast{position:fixed;left:12px;right:12px;bottom:100px;max-width:420px;margin:0 auto;z-index:30;
  background:#2a1442;border:1px solid var(--edge);color:var(--text);padding:14px 16px;
  border-radius:12px;font-size:15px;line-height:1.4}
.row2{display:flex;gap:10px}.row2>*{flex:1}

@media (min-width:900px){
  body{padding-bottom:112px}
  .wrap{max-width:1180px;padding:20px 24px 0}
  .stick{padding:18px 24px;font-size:28px}
  .stick .wrap{max-width:1180px}
  .idline{font-size:28px}
  .hero{display:flex;align-items:center;justify-content:flex-start;gap:26px;text-align:left;
    padding:18px 0 6px}
  .ava{width:126px;height:126px;margin:0;flex:none}
  .title{margin:0;font-size:23px;text-align:left}
  .primary{max-width:340px;margin-left:0}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:24px;align-items:start}
  .colMain,.colSide{min-width:0}
  .colMain > h2:first-child,.colSide > h2:first-child{margin-top:20px}
  .games{grid-template-columns:1fr;gap:14px}
  .game{padding:18px 20px}
  .game .gs{grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
  .game .gs > div{background:var(--tile);padding:12px 14px}
  .colSide .grid{grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
  .colSide .tiles{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
  .grid{grid-template-columns:repeat(auto-fill,minmax(86px,1fr))}
  .srow b{font-size:36px}
  .tabs{left:50%;right:auto;transform:translateX(-50%);max-width:580px;width:100%;
    border:1px solid var(--edge);border-bottom:none;border-radius:16px 16px 0 0}
  .tabs button{font-size:15px}
  .modal{display:grid;place-items:center;padding:32px}
  .modal .inner{min-height:0;width:100%;max-width:920px;max-height:86vh;overflow:auto;
    border-radius:20px;border:1px solid var(--edge);padding:24px 26px 30px;
    box-shadow:0 24px 70px rgba(0,0,0,.5);scrollbar-width:thin}
  .modal .mhead{position:sticky;top:-24px;z-index:2;margin:-24px -26px 14px;
    padding:22px 26px 14px;background:var(--bg-b);
    border-bottom:1px solid var(--edge);border-radius:20px 20px 0 0}
  .modal .tiles{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
  .modal .grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
  .modal .card{margin-top:0}
  .toast{bottom:120px}
  .game:hover{border-color:rgba(255,192,46,.4);transform:translateY(-3px);
    box-shadow:0 14px 30px rgba(0,0,0,.4)}
  .game:hover::before{transform:scaleX(1)}
  .game:hover::after{opacity:1}
  .game:hover b{color:var(--gold)}
  .chip:hover,.mini:hover{border-color:rgba(255,192,46,.4);
    background:color-mix(in srgb, var(--gold) 9%, var(--panel))}
  .chip[aria-pressed="true"]:hover{background:var(--gold);border-color:var(--gold)}
  .tile.tap:hover{background:color-mix(in srgb, var(--gold) 11%, var(--tile));
    box-shadow:inset 0 0 0 1px rgba(255,192,46,.25)}
  .close:hover{filter:brightness(1.12)}
  .it{transition:transform .18s ease,box-shadow .18s ease}
  .it:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 10px 20px rgba(0,0,0,.4)}
  .cos:hover .ciw{transform:scale(1.06);transition:transform .18s ease}
  .row2{gap:14px}
}
@media (min-width:1200px){
  .wrap{max-width:1280px}
  .stick .wrap{max-width:1280px}
}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(22px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes slideDown{to{transform:translateY(26px);opacity:0}}
.modal.out{animation:fadeOut .2s ease forwards}
.modal.out .inner{animation:slideDown .22s cubic-bezier(.4,0,1,1) forwards}
@keyframes toastIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion: no-preference){
  .tile,.game,.cos{animation:rise .3s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*22ms)}
  .modal{animation:fadeIn .16s ease-out}
  .modal .inner{animation:slideUp .28s cubic-bezier(.2,.8,.2,1)}
  .toast{animation:toastIn .22s cubic-bezier(.2,.8,.2,1)}
  .primary.busy{animation:pulse 1.1s ease-in-out infinite}
  .bar i{transition:width .7s cubic-bezier(.2,.8,.2,1)}
}
.primary,.mini,.chip,.game,.close,.tabs button{transition:transform .12s ease,background .2s ease,
  color .2s ease,border-color .2s ease,box-shadow .2s ease,opacity .2s ease}
.primary:active:not(:disabled),.mini:active,.close:active{transform:scale(.97)}
.chip:active{transform:scale(.95)}
.game:active{transform:scale(.985)}
.lite #spot,.lite #aura,.lite #comb{animation:none !important}
.lite .nk,.lite .rl{animation:none !important;background:none;color:var(--text);
  -webkit-text-fill-color:currentColor}
.lite .rl{color:var(--rankc)}
.lite .rv{transition:none !important;opacity:1 !important;transform:none !important}
.lite .tile,.lite .game,.lite .cos{animation:none !important}
.rv{opacity:0;transform:translate3d(0,16px,0)}
@media (prefers-reduced-motion: no-preference){

}

  const o = document.querySelector(".toast"); if(o) o.remove();
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = t; el.onclick = () => el.remove();
  document.body.append(el);

}
function when(ts){
  const d = new Date(ts), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const day = sameDay ? (L === "ru" ? "сегодня" : "today")
    : d.getDate() + "." + String(d.getMonth()+1).padStart(2,"0");
  return day + ", " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

  if(typeof v !== "number") return String(v);

  const p = n => String(n).padStart(2,"0");
  return p(d.getDate()) + "." + p(d.getMonth()+1) + "." + d.getFullYear();
}

  "6":"#FFAA00","7":"#AAAAAA","8":"#555555","9":"#5555FF",a:"#55FF55",b:"#55FFFF",c:"#FF5555",
  d:"#FF55FF",e:"#FFFF55",f:"#FFFFFF",g:"#DDD605",
  u:"#B14BFF",i:"#FFC02E",j:"#C77DFF",p:"#5BE8C4",m:"#9AA0B5",t:"#FF6B5A",h:"#FF7AB8",
  n:"#C68A4E",q:"#5CE68A",r:"#FFFFFF",s:"#7FE8FF"};
function mcText(str){
  const t = String(str);
  if(!/[§&][0-9a-z]/i.test(t)) return esc(pretty(t));
  let out = "", cur = null, buf = "";
  const flush = () => { if(!buf) return;
    out += cur ? '<span style="color:' + cur + '">' + esc(buf) + "</span>" : esc(buf); buf = ""; };
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if((c === "§" || c === "&") && MCCOL[(t[i+1] || "").toLowerCase()]){
      flush(); cur = MCCOL[t[++i].toLowerCase()];
    } else if((c === "§" || c === "&") && /[k-or]/i.test(t[i+1] || "")){ flush(); i++; }
    else buf += c;
  }
  flush();
  return out;
}
const CDN_PREFIX = { avatar:"", hat:"hat-", costume:"costume-", backbling:"backbling-",
  back_bling:"backbling-", mount:"mount-", pet:"pet-", hub_title:null, title:null };
function iconUrl(base, id){

  const slug = id.toLowerCase().replace(/[''"".!?()]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

/* ---------- запрос ---------- */
function urlFor(game){
  const path = game === "main" ? "/game/all/main/" + encodeURIComponent(state.nick)
                               : "/game/all/" + game + "/" + encodeURIComponent(state.nick);
  const full = API + path, p = state.proxy || "";
  return p.includes("{url}") ? p.replace("{url}", encodeURIComponent(full)) : p + full;
}
async function pull(game){
  if(budgetLeft() <= 0) throw new Error(T("budgetOut"));
  noteRequest();
  let res;
  try{ res = await fetch(urlFor(game), { cache:"no-store" }); }
  catch(e){ throw new Error(T("netErr")); }
  if(res.status === 404) return { missing:true };
  if(res.status === 429){
    const ra = res.headers.get("Retry-After");
    throw new Error(T("limitErr") + (ra ? T("limitWait", Math.ceil(ra/60)) : ""));
  }
  if(!res.ok) throw new Error(T("httpErr", res.status));
  let data = await res.json();
  if(data && typeof data === "object" && !Array.isArray(data)){
    const ks = Object.keys(data);
    if(ks.length === 1 && data[ks[0]] && typeof data[ks[0]] === "object" && !Array.isArray(data[ks[0]]))
      data = data[ks[0]];                       // ответ обёрнут: {"main": {…}}
  }
  return { data };
}
async function snapshot(){
  if(!state.nick){ toast(T("needNick")); return; }
  const n = nickKey();
  const gap = SNAP_GAP - (Date.now() - state.lastSnapAt);
  if(gap > 0){ toast(T("snapGap", Math.ceil(gap / 1000))); return; }
  if(!nickAllowed(n)){ toast(T("nickLimit", NICK_LIMIT)); return; }
  if(budgetLeft() <= 0){ toast(T("budgetOut")); return; }
  noteNick(n);
  state.lastSnapAt = Date.now(); save();
  const btn = $("#fetchBtn");
  btn.disabled = true; btn.classList.add("busy"); btn.textContent = T("snapping");
  const now = Date.now(), snap = { t: now, n: nickKey(), g: {} }, skipped = [], failed = [];
  for(const g of state.games){
    if(now - (state.last[lk(g)] || 0) < cdMs()){ skipped.push(NAME(g)); continue; }
    try{
      const r = await pull(g);
      state.last[lk(g)] = Date.now();
      if(r.missing){ if(!state.dead.includes(g)) state.dead.push(g); }
      else { snap.g[g] = r.data; state.dead = state.dead.filter(x => x !== g); }
    }catch(e){ failed.push(NAME(g) + " — " + e.message); }
    await new Promise(r => setTimeout(r, 700));
  }
  if(Object.keys(snap.g).length){
    const mine = mySnaps(), prev = mine[mine.length-1];
    if(prev) for(const g in prev.g) if(!(g in snap.g)) snap.g[g] = prev.g[g];
    state.snaps.push(snap);
    if(state.snaps.length > 300) state.snaps.shift();
    save();
  }
  btn.disabled = false; btn.classList.remove("busy"); btn.textContent = T("snap");
  renderSnap(); renderTrend();
  if(failed.length) toast(failed.join("; "));
  else if(!Object.keys(snap.g).length && skipped.length) toast(T("cooldownAll"));
  else if(skipped.length) toast(T("skipped", skipped.join(", ")));
}

/* ---------- метрики игры ---------- */
const KILL_KEY = /(^|_)kills$/;
const KILL_EXTRA = /^(murders|murderer_eliminations|eliminations)$/;
function killsParts(c){
  let base = 0, fin = 0;
  if(!c) return { base, fin };
  for(const key of Object.keys(c)){
    const v = c[key];
    if(typeof v !== "number") continue;
    if(key === "final_kills") fin += v;
    else if(KILL_KEY.test(key) || KILL_EXTRA.test(key)) base += v;
  }
  return { base, fin };
}
function killsOf(c){
  const p = killsParts(c);
  return p.base + (state.finals ? p.fin : 0);
}

function metrics(cur, old){
  const out = [];
  const delta = k => {
    if(!old || typeof cur[k] !== "number" || typeof old[k] !== "number") return "";
    const d = cur[k] - old[k];
    return d === 0 ? "" : (d > 0 ? "+" : "−") + nf(Math.abs(d));
  };
  const played = num(cur,"played") || num(cur,"games_played");
  const wins = num(cur,"victories"), kills = num(cur,"kills"), deaths = num(cur,"deaths");
  let firstTile = null;

  for(const k of Object.keys(cur)){
    if(SKIP.has(k)) continue;
    const v = cur[k];
    if(v === null || typeof v === "object") continue;
    if(typeof v === "boolean"){ out.push({ k:label(k), v: v ? "✓" : "—", d:"" }); continue; }
    if(hasMC(v)){ out.push({ k:label(k), v:String(v).replace(/[§&][0-9a-z]/gi,""),
      vhtml:mcText(v), d:"" }); continue; }
    if(isDateKey(k) && typeof v === "number" && v > 1e8){
      firstTile = { k:T("firstPlayed"), v:dateOf(v), d:"", wide:true }; continue;
    }
    out.push({ k:label(k), v:nf(v), d:delta(k) });
  }
  if(played && wins) out.push({ k:T("winrate"), v:pct(wins, played), d:"", wide:true });
  if(firstTile) out.push(firstTile);
  if(played && wins) out.push({ k:T("losses"), v:nf(played - wins), d:"" });
  if(kills || deaths) out.push({ k:T("kd"), v:ratio(kills, deaths), d:"" });
  if(played && kills) out.push({ k:T("perGameK"), v:ratio(kills, played), d:"" });
  if(played && deaths) out.push({ k:T("perGameD"), v:ratio(deaths, played), d:"" });
  if(played && num(cur,"xp")) out.push({ k:T("perGameX"), v:ratio(num(cur,"xp"), played), d:"" });
  if(played && num(cur,"final_kills")) out.push({ k:T("perGameF"), v:ratio(num(cur,"final_kills"), played), d:"" });
  return out;
}

/* ---------- косметика ---------- */
function cosGroups(src){
  const g = {}, set = (b, kind, v) => { (g[b] = g[b] || {})[kind] = v; };
  const main = Object.assign({}, src);
  for(const box of ["cosmetics","appearance","equipped","unlocked","collection"]){
    if(src[box] && typeof src[box] === "object" && !Array.isArray(src[box]))
      for(const k of Object.keys(src[box])){
        const key = /^(equipped|unlocked)$/.test(box) ? k + "_" + box : k;
        if(!(key in main)) main[key] = src[box][k];
      }
  }
  for(const k of Object.keys(main)){
    let m;
    if((m = k.match(/^cosmetics\.(.+)$/))) set(m[1], "un", main[k]);
    else if((m = k.match(/^(.+)_equipped$/))) set(m[1], "eq", main[k]);
    else if((m = k.match(/^equipped_(.+)$/))) set(m[1], "eq", main[k]);
    else if((m = k.match(/^(.+)_unlocked$/))) set(m[1], "un", main[k]);
    else if((m = k.match(/^unlocked_(.+)$/))) set(m[1], "un", main[k]);
    else if((m = k.match(/^(.+?)_(?:count|owned|total)$/)) && COS_WORDS.test(m[1]))
      set(m[1].replace(/s$/,""), "un", main[k]);
    else if(COS_WORDS.test(k)){
      const base = k.replace(/s$/,"");
      const v = main[k];
      if(Array.isArray(v) || typeof v === "number") set(base, "un", v);
      else if(typeof v === "string" || (v && typeof v === "object")) set(base, "eq", v);
    }
  }
  return g;
}

const cosIcon = v => { if(v && typeof v === "object"){

const cosCount = v => typeof v === "number" ? v : Array.isArray(v) ? v.length

  document.documentElement.style.setProperty("--rankc2", tag ? tag.c2 : "#ffe6a6");
  const tagHTML = tag ? ' <span class="tag">[<span class="rl">' + tag.t + "</span>]</span>" : "";
  const idHTML = '<span class="nk">' + esc(state.nick || T("noNick")) + tagHTML + "</span>";
  $("#stickNick").innerHTML = idHTML;
  $("#stickTag").innerHTML = "";

  hero.innerHTML = '<h1 class="idline">' +
      (typeof hubLevel === "number" ? '<span class="lvl">' + esc(T("level")) + " " + nf(hubLevel) + "</span>" : "") +
      idHTML + "</h1>" +
    '<div class="hero"><div class="ava"><span>' +
      (avaUrl ? '<img alt="" src="' + esc(avaUrl) + '" onerror="this.replaceWith(document.createTextNode(' +
          JSON.stringify(letter).replace(/"/g,"&quot;") + '))">'
       : typeof avaName === "string"
        ? '<img alt="" src="https://cdn.playhive.com/avatars/' + encodeURIComponent(avaName) +
          '.png" onerror="this.replaceWith(document.createTextNode(' +
          JSON.stringify(letter).replace(/"/g,"&quot;") + '))">'
        : esc(letter)) +
    "</span></div>" +
    (title ? '<p class="title">' + mcText(cosName(title) || title) + "</p>" : "") + "</div>";

  tickStatus();

  body.innerHTML = "";
  if(!last) return;

  if(main) renderStreak(main, body);

  let cols = null;                       // левая колонка — игры, правая — косметика
  const col = which => {
    if(!cols){
      cols = document.createElement("div");
      cols.className = "cols";
      cols.innerHTML = '<div class="colMain"></div><div class="colSide"></div>';
      body.append(cols);
    }
    return cols.querySelector(which === "side" ? ".colSide" : ".colMain");
  };

  const playedOf = c => num(c,"played") || num(c,"games_played");
  const codes = state.games.filter(g => g !== "main" && last.g[g])
    .sort((a,b) => playedOf(last.g[b]) - playedOf(last.g[a]));

  if(codes.length){
    let P=0, W=0, K=0, D=0, LV=0, PR=0, XP=0, pP=0, pW=0, pK=0;
    codes.forEach(g => {
      const c = last.g[g], o = prev && prev.g[g];
      P += playedOf(c); W += num(c,"victories"); K += killsOf(c); D += num(c,"deaths");
      LV += Math.floor(gameLevel(c, g)); PR += num(c,"prestige"); XP += num(c,"xp");
      if(o){ pP += playedOf(o); pW += num(o,"victories"); pK += killsOf(o); }
    });
    const dl = (now, was) => prev && was && now > was ? "+" + nf(now - was) : "";
    const tiles = [
      { k:T("played"), v:nf(P), d:dl(P,pP) },
      { k:T("wins"), v:nf(W), d:dl(W,pW) },
      { k:T("winrate"), v:pct(W,P), d:"" },
      { k:T("killsTotal"), v:nf(K), d:dl(K,pK), act:"kills" },
      { k:T("kd"), v:ratio(K,D), d:"" }
    ];
    tiles.push(LV ? { k:T("levelSum"), v:nf(LV) + (PR ? " (+" + PR + ")" : ""), d:"" }
                  : { k:T("xpTotal"), v:nf(XP), d:"" });
    body.insertAdjacentHTML("beforeend", "<h2>" + esc(T("totalOver", codes.length)) + "</h2>" +
      '<div class="card">' + tilesHTML(tiles) + "</div>");

    const most = codes[0];
    const cards = codes.map(g => {
      const c = last.g[g], played = playedOf(c), wins = num(c,"victories");
      return '<button class="game" data-g="' + g + '"><b>' + esc(NAME(g)) +
        (g === most ? '<span class="badge">' + esc(T("mostPlayed")) + "</span>" : "") + "</b>" +
        '<div class="gs">' +
          "<div><span>" + nf(wins) + "</span><small>" + esc(T("winsLow")) + "</small></div>" +
          "<div><span>" + nf(played) + "</span><small>" + esc(T("playedLow")) + "</small></div>" +
          "<div><span>" + (played ? pct(wins, played) : "—") + "</span><small>" +
            esc(T("winrateLow")) + "</small></div>" +
        "</div></button>";
    }).join("");
    col("main").insertAdjacentHTML("beforeend",
      "<h2>" + esc(T("games")) + '</h2><div class="games">' + cards + "</div>");
    body.querySelectorAll(".game").forEach((b, i) => {
      b.style.setProperty("--i", i);
      b.onclick = () => openGame(b.dataset.g);
    });
    body.querySelectorAll('[data-act="kills"]').forEach(el => el.onclick = openKills);
  }

  if(main){
    const html = cosmeticsHTML(main);
    if(html) col("side").insertAdjacentHTML("beforeend", "<h2>" + esc(T("appearance")) + "</h2>" + html);
    col("side").insertAdjacentHTML("beforeend", "<h2>" + esc(T("profileAll")) +
      '</h2><div class="card" style="text-align:center">' +
      '<button class="mini" id="openMain">' + esc(T("showAll")) + "</button></div>");
    const b = body.querySelector("#openMain");
    if(b) b.onclick = () => openGame("main");
  }else{
    body.insertAdjacentHTML("beforeend", '<div class="note">' + esc(T("noProfile")) + "</div>");
  }
  body.querySelectorAll("[data-cos]").forEach(b => b.onclick = () => {
    const g = window.__cos || {}, k = b.dataset.cos;
    const arr = itemsOf(g[k] && g[k].un) || [];
    if(arr.length) openCos(k, arr);
  });
  if(state.dead.length)
    body.insertAdjacentHTML("beforeend", '<div class="note">' +
      esc(T("deadNote", state.dead.map(NAME).join(", "))) + "</div>");
  fitText(body);
  reveal(body);
}

function renderStreak(main, body){
  const cur = pick(main, "daily_login_streak", "login_streak");
  const best = pick(main, "longest_daily_login_streak", "longest_login_streak");
  const gday = ts => Math.floor(ts / 86400000);          // игровые сутки: 00:00 UTC
  const today = gday(Date.now());

  let updated = null;
  if(typeof cur === "number"){
    const mine = mySnaps();
    for(let i = mine.length - 1; i >= 0; i--){
      const sn = mine[i];
      if(!sn.g.main || gday(sn.t) >= today) continue;
      const was = pick(sn.g.main, "daily_login_streak", "login_streak");
      if(typeof was === "number"){ updated = cur > was; break; }
    }
  }
  const cls = updated === true ? "ok" : updated === false ? "no" : "unk";
  const txt = updated === true ? T("streakDone") : updated === false ? T("streakWait") : T("streakUnknown");

  const nextTs = (today + 1) * 86400000;
  const left = nextTs - Date.now();
  const h = Math.floor(left / 3600000), mn = Math.floor(left % 3600000 / 60000);
  const at = new Date(nextTs).toLocaleTimeString(L === "ru" ? "ru-RU" : "en-US",
    { hour:"2-digit", minute:"2-digit" });

  body.insertAdjacentHTML("beforeend", '<div class="card">' +
    '<div class="srow">' +
      "<div><b>" + esc(cur === undefined ? "—" : nf(cur)) + "</b><small>" + esc(T("streakNow")) + "</small></div>" +
      '<div class="sep"></div>' +
      "<div><b>" + esc(best === undefined ? "—" : nf(best)) + "</b><small>" + esc(T("streakBest")) + "</small></div>" +
    "</div>" +
    '<div class="sfoot"><span class="pill ' + cls + '">' + esc(txt) + "</span>" +
    '<span class="reset">' + esc(T("resetIn", h + " " + T("hh") + " " + mn + " " + T("mm"), at)) +
    "</span></div></div>");
}

function tickStatus(){
  const mine = mySnaps();
  const last = mine[mine.length-1];
  const cool = state.games.map(g => cdMs() - (Date.now() - (state.last[lk(g)] || 0))).filter(ms => ms > 0);
  const readyIn = cool.length === state.games.length ? Math.ceil(Math.min(...cool) / 60000) : 0;
  const btn = $("#fetchBtn");
  if(!btn.classList.contains("busy")){
    btn.disabled = !!readyIn;
    btn.textContent = readyIn ? T("snap") + " · " + T("min", readyIn) : T("snap");
  }
  $("#subtitle").textContent = !last ? T("noSnaps")
    : T("lastSnap", when(last.t), mine.length) + (readyIn ? T("nextIn", readyIn) : "") +
      " · " + T("budget", budgetLeft(), REQ_LIMIT);
}

/* ---------- динамика ---------- */
const DERIVED = {
  __winrate: c => { const p = num(c,"played") || num(c,"games_played");
    return p ? +(num(c,"victories") / p * 100).toFixed(2) : null; },
  __kd: c => { const d = num(c,"deaths"); return d ? +(num(c,"kills") / d).toFixed(2) : null; }
};
const derivedLabel = k => k === "__winrate" ? T("winrate") : k === "__kd" ? T("kd") : label(k);
function metricVal(c, k){
  if(!c) return null;
  if(DERIVED[k]) return DERIVED[k](c);
  return typeof c[k] === "number" ? c[k] : null;
}

function renderTrend(){
  const gSel = $("#trendGame"), mSel = $("#trendMetric"), body = $("#trendBody");
  const mine = mySnaps();
  const withData = state.games.filter(g => mine.some(s => s.g[g]));
  if(mine.length < 2){
    body.innerHTML = '<p class="sub" style="margin-top:20px">' + esc(T("trendNeed")) + "</p>";
    gSel.innerHTML = mSel.innerHTML = ""; return;
  }
  const keepG = gSel.value;
  gSel.innerHTML = withData.map(g => '<option value="' + g + '">' + esc(NAME(g)) + "</option>").join("");
  if(withData.includes(keepG)) gSel.value = keepG;
  const game = gSel.value;

  const numeric = new Set();
  mine.forEach(s => { const d = s.g[game]; if(d) Object.keys(d).forEach(k => {
    if(!SKIP.has(k) && typeof d[k] === "number" && !isDateKey(k)) numeric.add(k); }); });
  const opts = [];
  const sample = (mine.map(x => x.g[game]).filter(Boolean).pop()) || {};
  if(metricVal(sample, "__winrate") !== null) opts.push("__winrate");
  if(metricVal(sample, "__kd") !== null) opts.push("__kd");
  opts.push(...numeric);
  const keepM = mSel.value;
  mSel.innerHTML = opts.map(k => '<option value="' + k + '">' + esc(derivedLabel(k)) + "</option>").join("");
  if(opts.includes(keepM)) mSel.value = keepM;
  const metric = mSel.value;

  const pts = mine.filter(s => s.g[game] && metricVal(s.g[game], metric) !== null)
    .map(s => ({ t:s.t, v:metricVal(s.g[game], metric) }));
  if(pts.length < 2){ body.innerHTML = '<p class="sub" style="margin-top:20px">' + esc(T("trendFew")) + "</p>"; return; }

  const unit = metric === "__winrate" ? "%" : "";
  const fmtM = n => (metric === "__kd" || metric === "__winrate" ? n.toFixed(2) : nf(n)) + unit;
  const W = 300, H = 110;
  const vs = pts.map(p => p.v), min = Math.min(...vs), max = Math.max(...vs), span = (max - min) || 1;
  const x = i => i / (pts.length - 1) * W, y = v => H - (v - min) / span * (H - 10) - 5;
  const path = pts.map((p,i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  const grew = vs[vs.length-1] - vs[0];

  const lastX = (x(pts.length-1) / W * 100).toFixed(2);
  const lastY = (y(vs[vs.length-1]) / H * 100).toFixed(2);

  body.innerHTML = '<div class="card"><div class="chart">' +
    '<svg class="line" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img">' +
    '<path vector-effect="non-scaling-stroke" d="' + path + '"/></svg>' +
    '<i class="dot" style="left:' + lastX + '%;top:' + lastY + '%"></i></div>' +
    '<div class="tmeta"><span>' + esc(when(pts[0].t)) + "</span><span>" +
    esc(when(pts[pts.length-1].t)) + "</span></div>" +
    '<p class="sub">' + esc(T("trendGrowth", derivedLabel(metric), fmtM(min), fmtM(max),
      (grew >= 0 ? "+" : "−") + fmtM(Math.abs(grew)))) + "</p></div>";
}
$("#trendGame").onchange = renderTrend;
$("#trendMetric").onchange = renderTrend;

/* ---------- настройки и язык ---------- */
function renderChips(){
  const box = $("#gameChips"); box.innerHTML = "";
  GAMES.forEach(([code]) => {
    const b = document.createElement("button");
    b.className = "chip" + (state.dead.includes(code) ? " dead" : "");
    b.textContent = NAME(code);
    b.setAttribute("aria-pressed", state.games.includes(code));
    b.onclick = () => {
      state.games = state.games.includes(code) ? state.games.filter(g => g !== code) : state.games.concat(code);
      save(); renderChips(); renderSnap(); renderTrend();
    };
    box.append(b);
  });
}
function applyLang(){
  L = langCode();
  document.documentElement.lang = L;
  $("#tab1").textContent = T("tab1"); $("#tab2").textContent = T("tab2"); $("#tab3").textContent = T("tab3");
  $("#fetchBtn").textContent = T("snap");
  $("#trendHead").textContent = T("tab2"); $("#setHead").textContent = T("tab3");
  $("#lNick").textContent = T("lNick"); $("#nick").placeholder = T("nickPh");
  $("#lLang").textContent = T("lLang"); $("#lang").options[0].textContent = T("auto");
  $("#lGames").textContent = T("lGames");
  $("#lCd").textContent = T("cdLabel");
  const cdSel = $("#cd");
  cdSel.innerHTML = [5,10,15,30,60].map(v =>
    '<option value="' + v + '">' + T("min", v) + "</option>").join("");
  cdSel.value = String(state.cd);
  $("#lFinals").textContent = T("finalsLabel");
  $("#finals").checked = !!state.finals;
  $("#lLite").textContent = T("liteLabel");
  $("#lite").checked = !!state.lite;
  tickDiag();
  $("#lProxy").textContent = T("lProxy"); $("#proxy").placeholder = T("proxyPh");
  $("#proxyHint").textContent = T("proxyHint");
  $("#exportBtn").textContent = T("exportBtn"); $("#importBtn").textContent = T("importBtn");
  $("#wipeBtn").textContent = T("wipeBtn"); $("#diagBtn").textContent = T("diagBtn");
  $("#limitNote").textContent = T("limitNote");
  renderChips(); renderSnap(); renderTrend();
}
$("#cd").onchange = e => { state.cd = parseInt(e.target.value,10) || 5; save(); renderSnap(); };
$("#finals").onchange = e => { state.finals = e.target.checked; save(); renderSnap(); };
$("#lite").onchange = e => {
  state.lite = e.target.checked; save();
  document.documentElement.classList.toggle("lite", state.lite);
};
$("#lang").value = state.lang;
$("#lang").onchange = e => { state.lang = e.target.value; save(); let stickOn = false, stickTick = false;
addEventListener("scroll", () => {
  if(stickTick) return;
  stickTick = true;
  requestAnimationFrame(() => {
    stickTick = false;
    const on = scrollY > 130 && !$("#vSnap").classList.contains("hidden");
    if(on !== stickOn){ stickOn = on; $("#stick").classList.toggle("on", on); }
  });
}, { passive:true });

document.documentElement.classList.toggle("lite", !!state.lite);
applyLang(); };
$("#nick").value = state.nick;
let nickTimer = null;
$("#nick").oninput = e => {
  const was = nickKey();
  state.nick = e.target.value.trim();
  if(nickKey() !== was){
    state.dead = [];                       // «нет данных» относилось к прошлому нику
    state.lastDiag = 0;                    // проверку профиля можно делать сразу
    tickDiag();
  }
  save();
  clearTimeout(nickTimer);
  nickTimer = setTimeout(() => { renderSnap(); renderTrend(); }, 250);
};
$("#proxy").value = state.proxy;
$("#proxy").oninput = e => { state.proxy = e.target.value.trim(); save(); };
$("#exportBtn").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state)], { type:"application/json" }));
  a.download = "hive-" + (state.nick || "stats") + ".json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$("#importBtn").onclick = () => $("#importFile").click();
$("#importFile").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const p = JSON.parse(r.result);
      if(!Array.isArray(p.snaps)) throw new Error("no snapshots");
      state = Object.assign(state, p); save();
      $("#nick").value = state.nick; $("#lang").value = state.lang || "auto";
      let stickOn = false, stickTick = false;
addEventListener("scroll", () => {
  if(stickTick) return;
  stickTick = true;
  requestAnimationFrame(() => {
    stickTick = false;
    const on = scrollY > 130 && !$("#vSnap").classList.contains("hidden");
    if(on !== stickOn){ stickOn = on; $("#stick").classList.toggle("on", on); }
  });
}, { passive:true });

applyLang(); toast(T("imported"));
    }catch(err){ toast(T("unreadable", err.message)); }
  };
  r.readAsText(f); e.target.value = "";
};
$("#wipeBtn").onclick = () => {
  if(!confirm(T("wipeAsk"))) return;
  const n = nickKey();
  state.snaps = state.snaps.filter(x => (x.n || "") !== n);
  Object.keys(state.last).forEach(k => { if(k.startsWith(n + "|")) delete state.last[k]; });
  save(); renderSnap(); renderTrend();
};
$("#fetchBtn").onclick = snapshot;
$("#diagBtn").onclick = diag;
function tickDiag(){
  const b = $("#diagBtn"); if(!b) return;
  const left = Math.ceil((DIAG_CD - (Date.now() - state.lastDiag)) / 1000);
  if(left > 0){ b.disabled = true; b.textContent = T("diagBtn") + " · " + left; setTimeout(tickDiag, 1000); }
  else { b.disabled = false; b.textContent = T("diagBtn"); }
}

document.querySelectorAll(".tabs button").forEach(b => {
  b.onclick = () => {
    const v = b.dataset.v;
    $("#vSnap").classList.toggle("hidden", v !== "snap");
    $("#vTrend").classList.toggle("hidden", v !== "trend");
    $("#vSet").classList.toggle("hidden", v !== "set");
    document.querySelectorAll(".tabs button").forEach(x => x.removeAttribute("aria-current"));
    b.setAttribute("aria-current","page");
    if(v === "trend") renderTrend();
    if(v === "snap") renderSnap();
  };
});

let stickOn = false, stickTick = false;
addEventListener("scroll", () => {
  if(stickTick) return;
  stickTick = true;
  requestAnimationFrame(() => {
    stickTick = false;
    const on = scrollY > 130 && !$("#vSnap").classList.contains("hidden");
    if(on !== stickOn){ stickOn = on; $("#stick").classList.toggle("on", on); }
  });
}, { passive:true });

applyLang();
loadHiveData().then(() => { if(HD){ renderSnap(); } });
setInterval(tickStatus, 30000);
