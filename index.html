<title>Hive</title>
<link rel="stylesheet" href="css/style.css?v=202610091810">
</head>
<body>
<div id="aura" aria-hidden="true"></div>
<div id="shade" aria-hidden="true"></div>
<div id="spot" aria-hidden="true"></div>

<div class="wrap">
  <section id="vSnap">
    <div id="heroTop" class="herotop"></div>
    <div id="hero"></div>
    <button class="primary" id="fetchBtn"></button>
    <button class="myBtn hidden" id="myBtn" type="button"></button>
    <p class="sub" id="subtitle"></p>
    <div id="snapBody"></div>
    <footer class="slogan">
      <b>Better. Beautiful. Open.</b>
      <span id="sloganSub"></span>
      <a href="https://github.com/Deman-zez/HiveMC-Profile-Tracker" target="_blank" rel="noopener">GitHub ↗</a>
    </footer>
  </section>

  <section id="vTrend" class="hidden">
    <div class="phead"><h1 id="trendHead"></h1><p class="sub" id="trendSub"></p></div>
    <div class="trCols"><div class="trMain">
    <div id="trendToday"></div>
    <h2 id="trendChartHead"></h2>
    <div class="trendctl">
      <div class="row2" style="margin-top:12px">
        <select id="trendGame"></select>
        <select id="trendRange"></select>
      </div>
      <div class="row2" style="margin-top:10px">
        <select id="trendMetric"></select>
      </div>
    </div>
    <div id="trendBody"></div>
    <div id="trendAct"></div>
    </div><aside id="trendSide"></aside></div>
  </section>

  <section id="vTop" class="hidden">
    <div class="phead"><h1 id="topHead"></h1><p class="sub" id="topSub"></p></div>
    <div id="lbGlobal" class="lbglobal"></div>
    <div class="lbctl">
      <select id="lbGame"></select>
      <select id="lbPeriod"></select>
      <select id="lbSort"></select>
    </div>
    <div class="syncrow lbfind">
      <div class="nickbox"><input id="lbFind" type="text" autocapitalize="none" autocomplete="off" spellcheck="false">
        <div class="sugg hidden" id="lbSugg"></div></div>
      <button class="mini" id="lbFindBtn" type="button"></button>
    </div>
    <div id="lbFound"></div>
    <div id="lbBody"></div>
  </section>

  <section id="vSet" class="hidden">
    <div class="phead"><h1 id="setHead"></h1><p class="sub" id="setSub"></p></div>

    <div class="card set" id="cardNick">
      <label for="nick" id="lNick"></label>
      <div class="nickbox">
        <input id="nick" type="text" autocapitalize="none" autocomplete="off" spellcheck="false">
        <div class="sugg hidden" id="sugg"></div>
      </div>
      <label for="lang" id="lLang"></label>
      <select id="lang">
        <option value="auto"></option>
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="card set">
      <label id="lGames"></label>
      <div class="chips" id="gameChips"></div>
    </div>

    <div class="card set" id="cardSync">
      <label for="syncCode" id="lSync"></label>
      <div class="xbBox" id="xbBox"></div>
      <p class="hint syncOr" id="syncOr"></p>
      <div class="syncrow" id="syncRow">
        <div class="codebox">
          <input id="syncCode" type="text" autocapitalize="none" autocomplete="off" spellcheck="false">
          <button class="genBtn" id="syncGen" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="8.5" cy="8.5" r="1.4"/><circle cx="15.5" cy="15.5" r="1.4"/><circle cx="15.5" cy="8.5" r="1.4"/><circle cx="8.5" cy="15.5" r="1.4"/><circle cx="12" cy="12" r="1.4"/></svg></button>
        </div>
        <button class="mini" id="syncBtn" type="button"></button>
      </div>
      <div class="chips btns syncacts hidden" id="syncActs">
        <button class="mini" id="syncNowBtn" type="button"></button>
        <button class="mini" id="syncOffBtn" type="button"></button>
      </div>
      <p class="hint" id="syncStatus"></p>
      <p class="hint" id="syncHint"></p>
    </div>

    <div class="card set">
      <label class="check"><input type="checkbox" id="finals"><span id="lFinals"></span></label>
      <label class="check"><input type="checkbox" id="lite"><span id="lLite"></span></label>
    </div>

    <div class="card set">
      <button class="mini wipe" id="wipeBtn" type="button"></button>
    </div>

  </section>
</div>

<button type="button" class="toTop" id="toTop" tabindex="-1" aria-hidden="true">
<svg class="ttArrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18.5V6.5M6.5 11.5L12 6l5.5 5.5"/></svg></button>
<nav class="tabs glass">
  <span class="tabInd" aria-hidden="true"></span>
  <button data-v="snap" id="tab1" aria-current="page"><span><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.4-3.8 4.3-5.8 7.5-5.8s6.1 2 7.5 5.8"/></svg></span></button>
  <button data-v="trend" id="tab2"><span><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 17.5l5.5-5.5 4 4 7.5-7.5"/><path d="M15 8.5h5.5V14"/></svg></span></button>
  <button data-v="top" id="tab4"><span><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3.5h8v5.5a4 4 0 0 1-8 0V3.5z"/><path d="M8 5.5H5.2a2.8 2.8 0 0 0 3 4.4M16 5.5h2.8a2.8 2.8 0 0 1-3 4.4"/><path d="M12 13v3.5M8.5 20.5h7M10 16.5h4"/></svg></span></button>
  <button data-v="set" id="tab3"><span><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M18 7h2M4 17h3M11 17h9"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="9" cy="17" r="2.3"/></svg></span></button>
</nav>
